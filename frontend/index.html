    <style>
      /* Pantalla de carga con los colores corporativos (verde #019147 / azul #003786 del logo). Se muestra
         mientras el JS carga y la reemplaza React al montar. */
      html, body { margin: 0; background: #ffffff; }
      .zc-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #ffffff; color: #003786; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .zc-boot img { width: 132px; height: 132px; }
      .zc-boot-bar { width: 168px; height: 4px; border-radius: 2px; background: #e4ebf5; overflow: hidden; }
      .zc-boot-bar span { display: block; width: 45%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #019147, #003786); animation: zc-boot-slide 1.15s ease-in-out infinite; }
      .zc-boot p { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
      @keyframes zc-boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .zc-boot-bar span { animation: none; width: 100%; } }
    </style>
